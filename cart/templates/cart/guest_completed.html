{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h1 class="display-5 text-success mb-3">Purchase Successful!</h1>
          <p class="lead">Thank you for your purchase.</p>

          <hr>

          <p class="mt-3">
            <strong>Total paid:</strong>
            ${{ total|floatformat:2 }}
          </p>

          <div class="mt-4">
            <a href="{% url 'shop.index' %}" class="btn btn-primary me-2">
              Continue Shopping
            </a>
            <a href="{% url 'cart:view_cart' %}" class="btn btn-outline-secondary">
              View Cart
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
