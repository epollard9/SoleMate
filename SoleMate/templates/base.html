<!DOCTYPE html>
<html>
  {% load static %}
  <div class="flex-wrapper">
  <head>
    <title>{{ template_data.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body class="body" style="min-height: 50vh !important; max-height:60vh !important; display: block !important;height: 100% !important;overflow-y: hidden">
    <!-- Header -->
    <nav class="p-3 navbar navbar-dark bg-dark navbar-expand-lg" style="max-height:50px !important;">
      <div class="container">
         <a class="navbar-brand" href="{% url 'home.index' %}">
          <img src="{% static 'img/logo.png' %}" alt="logo" height="40" />
        </a>
        <div class="banner"> SoleMate</div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav ms-auto navbar-ml">
            <a class="nav-link" href="{% url 'home.about' %}">About</a>
            <a class="nav-link bg-dark" href="{% url 'home.news' %}">News</a>
            <a class="nav-link bg-dark" href="{% url 'shop.index' %}">Shop</a>
            <a class="nav-link bg-dark" href="{% url 'cart.view_cart' %}">Cart</a>
            <div class="vr bg-light mx-2 d-none d-lg-block"></div>
            {% if user.is_authenticated %}
            <a class="nav-link bg-dark" href="{% url 'accounts.logout' %}">Logout ({{ user.username }})</a>
            {% else %}
            <a class="nav-link bg-dark" href="{% url 'accounts.login' %}">Login</a>
            <a class="nav-link bg-dark" href="{% url 'accounts.signup' %}">Sign Up</a>
            {% endif %}
            <div class="vr bg-white mx-2 d-none d-lg-block"></div>
          </div>
        </div>
      </div>
    </nav>
    <!-- Header -->

    <div style="max-height: 50vh !important;">
      {% block hero %}{% endblock hero %}
      {% block content %}{% endblock content %}
    </div>

    <!--ai-->
    <div class="card p-3 m-5 shadow rounded">
      <h4 class="text-center">Ask Sole-Mate</h4>
      <textarea id="ai-input" class="form-control mb-2" rows="2" placeholder="Hi I am your Sole - Mate"></textarea>
      <div class="text-center">
        <button class="btn bg-dark text-white" onclick="sendAIRequest()">Ask</button>
      </div>
      <div id="ai-response" class="mt-3 border rounded p-2 text-dark bg-light" style="min-height: 50px;"></div>
    </div>

    <script>
      function getCSRFToken() {
        const name = "csrftoken";
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
          const trimmed = cookie.trim();
          if (trimmed.startsWith(name + '=')) {
            return decodeURIComponent(trimmed.substring(name.length + 1));
          }
        }
        return '';
      }

      async function sendAIRequest() {
        const input = document.getElementById("ai-input").value;
        const responseDiv = document.getElementById("ai-response");

        responseDiv.innerHTML = "Thinking...";

        try {
          const res = await fetch("/ai/chat/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({ prompt: input })
          });

          const contentType = res.headers.get("content-type");

          if (!res.ok) {
            const errorText = contentType && contentType.includes("application/json")
              ? (await res.json()).error
              : "Server returned non-JSON content.";
            throw new Error(errorText);
          }

          const data = await res.json();
          responseDiv.innerHTML = "<strong>SOLE-MATE:</strong> " + data.response;

        } catch (error) {
          responseDiv.innerHTML = "<strong>Request failed:</strong> " + error.message;
        }
      }
    </script>
  </body>
</div>
</html>
